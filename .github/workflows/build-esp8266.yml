name: Build ESP8266 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare secrets.h for CI build
        run: |
          cp esp8266/korotych_esp8266_opto/secrets.h.example esp8266/korotych_esp8266_opto/secrets.h
          if [ -n "${{ secrets.VILLAGE_TOKEN }}" ]; then
            sed -i "s|REPLACE_WITH_SENSOR_PUSH_TOKEN|${{ secrets.VILLAGE_TOKEN }}|g" esp8266/korotych_esp8266_opto/secrets.h
          fi

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "ArduinoJson@7.3.0"
          arduino-cli lib install "WiFiManager@2.0.17"

      - name: Compile sketch (Wemos D1 Mini, 4MB FS:1MB OTA:~1019KB)
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:d1_mini:eesz=4M1M \
            --output-dir build \
            esp8266/korotych_esp8266_opto

      - name: Upload compiled firmware.bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware-bin
          path: build/*.ino.bin
